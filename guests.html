<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Guest Dashboard · Lakshmi &amp; Srinivas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: one parchment ledger on maroon velvet — totals strip, filter tabs, guest rows. */
:root {
  --ground: #3d070d; --ground-2: #6a121c;
  --parch: #eedcb5; --parch-hi: #f6e8c8; --parch-lo: #d8bb85;
  --sepia: #3b1d10; --sepia-2: #6a4426; --antique: #8a5a1c; --gold: #e4b75a;
  --yes: #2f6b2a; --yes-bg: rgba(47,107,42,.12); --no: #9a1f1f; --no-bg: rgba(154,31,31,.10);
  --script: "Great Vibes", "Brush Script MT", cursive;
  --display: "Cinzel", Georgia, serif;
  --body: "Cormorant Garamond", Garamond, Georgia, serif;
  --foil: linear-gradient(105deg, #5e3a0e 0%, #8a5a1c 30%, #b98a3e 50%, #8a5a1c 70%, #5e3a0e 100%);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 0%, var(--ground-2) 0%, var(--ground) 70%) fixed, var(--ground);
  color: var(--sepia); font-family: var(--body); font-size: 18px; line-height: 1.45;
  padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.ledger {
  max-width: 760px; margin: 0 auto; padding: 34px 22px 28px; position: relative;
  background: radial-gradient(ellipse at 50% 35%, var(--parch-hi) 0%, var(--parch) 55%, var(--parch-lo) 100%);
  border: 1px solid #7a4e1a;
  box-shadow: inset 0 0 0 6px var(--parch), inset 0 0 0 7px var(--antique), inset 0 0 0 10px var(--parch), inset 0 0 0 11px rgba(138,90,28,.6), inset 0 0 60px rgba(120,70,20,.3), 0 24px 60px rgba(0,0,0,.6);
}
header { text-align: center; display: grid; gap: 2px; margin-bottom: 18px; }
.eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--antique); }
h1 { margin: 0; font-family: var(--script); font-weight: 400; font-size: clamp(38px, 10vw, 54px); line-height: 1.2; padding: .1em .2em;
  background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }
.updated { font-style: italic; color: var(--sepia-2); font-size: 16px; }

.totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 18px; }
.total { border: 1px solid rgba(138,90,28,.45); padding: 12px 10px 10px; text-align: center; background: rgba(255,248,230,.35); }
.total.hero { grid-column: 1 / -1; background: rgba(138,90,28,.1); border-color: var(--antique); }
.total b { display: block; font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.1; color: var(--sepia); font-variant-numeric: tabular-nums; }
.total.hero b { font-size: 54px; background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }
.total span { font-family: var(--display); font-size: 10px; letter-spacing: .12em; display: block; line-height: 1.35; text-transform: uppercase; color: var(--antique); }
@media (min-width: 620px) { .totals { grid-template-columns: repeat(4, minmax(0, 1fr)); } .total.hero { grid-column: span 1; } .total.hero b { font-size: 44px; } }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: 500 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--sepia);
  background: rgba(138,90,28,.08); border: 1px solid var(--antique); border-radius: 999px; padding: 10px 14px; cursor: pointer; }
button:hover { background: rgba(138,90,28,.18); }
button[aria-pressed="true"] { background: var(--antique); color: #fbf1dc; }
button:focus-visible { outline: 2px solid var(--antique); outline-offset: 2px; }

.list { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 2px; border-bottom: 1px solid rgba(138,90,28,.25); }
.row .who { font-weight: 600; font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.row .meta { grid-column: 1 / -1; color: var(--sepia-2); font-size: 16px; display: flex; flex-wrap: wrap; gap: 2px 14px; overflow-wrap: anywhere; }
.row .meta a { color: inherit; }
.pill { align-self: start; font: 500 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.yes { color: var(--yes); background: var(--yes-bg); }
.pill.no { color: var(--no); background: var(--no-bg); }
.empty { text-align: center; padding: 28px 10px; color: var(--sepia-2); font-style: italic; }
.empty b { font-style: normal; font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--antique); display: block; margin-bottom: 6px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.note { text-align: center; font-size: 15px; font-style: italic; color: var(--sepia-2); margin: 10px 0 0; min-height: 1.2em; }
</style>
</head>
<body>
<main class="ledger">
  <header>
    <div class="eyebrow">25 November 2026 · Bridgewater Balaji Temple</div>
    <h1>Guest Dashboard</h1>
    <div class="updated" id="updated">Loading replies…</div>
  </header>

  <section class="totals" aria-label="Totals">
    <div class="total hero"><b id="tGuests">–</b><span>Guests coming</span></div>
    <div class="total"><b id="tYes">–</b><span>Families attending</span></div>
    <div class="total"><b id="tNo">–</b><span>Not attending</span></div>
    <div class="total"><b id="tAll">–</b><span>Total replies</span></div>
  </section>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Show">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="yes" aria-pressed="false">Attending</button>
      <button type="button" data-f="no" aria-pressed="false">Not attending</button>
    </div>
    <button type="button" id="refresh">Refresh</button>
  </div>

  <div class="list" id="list"></div>

  <div class="tools">
    <button type="button" id="copyNums">Copy WhatsApp numbers</button>
    <button type="button" id="copyEmails">Copy emails</button>
  </div>
  <p class="note" id="note"></p>
</main>

<script>
(function () {
  // Google Sheet web app URL (same one the invitation form sends to)
  const SHEET_URL = "";
  const key = (location.hash.match(/k=([^&]+)/) || [])[1] || "";
  const $ = (id) => document.getElementById(id);
  let rows = [], filter = "all";

  function fmtDate(v) {
    const d = new Date(v); if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    const yes = rows.filter(r => r.attending === "yes"), no = rows.filter(r => r.attending === "no");
    $("tGuests").textContent = yes.reduce((n, r) => n + (Number(r.guests) || 1), 0);
    $("tYes").textContent = yes.length; $("tNo").textContent = no.length; $("tAll").textContent = rows.length;
    const shown = filter === "all" ? rows : filter === "yes" ? yes : no;
    const list = $("list"); list.textContent = "";
    if (!shown.length) {
      const e = el("div", "empty"); e.appendChild(el("b", null, rows.length ? "No one here yet" : "No replies yet"));
      e.appendChild(document.createTextNode(rows.length ? "Try another tab." : "Replies appear here as soon as guests send their details."));
      list.appendChild(e); return;
    }
    shown.slice().sort((a, b) => new Date(b.time) - new Date(a.time)).forEach(r => {
      const row = el("div", "row");
      row.appendChild(el("div", "who", r.name || "—"));
      const going = r.attending === "yes";
      row.appendChild(el("span", "pill " + (going ? "yes" : "no"), going ? "Coming · " + (Number(r.guests) || 1) : "Not coming"));
      const meta = el("div", "meta");
      if (r.phone) { const a = el("a", null, r.phone); a.href = "https://wa.me/" + String(r.phone).replace(/\D/g, ""); a.target = "_blank"; a.rel = "noopener"; meta.appendChild(a); }
      if (r.email) meta.appendChild(el("span", null, r.email));
      if (going) meta.appendChild(el("span", null, r.reminders === "yes" ? "Wants reminder" : "No reminder"));
      if (r.time) meta.appendChild(el("span", null, "Replied " + fmtDate(r.time)));
      row.appendChild(meta); list.appendChild(row);
    });
  }

  async function load() {
    if (!SHEET_URL) { $("updated").textContent = "Not connected yet"; render(); $("note").textContent = "Your guest sheet isn't connected yet."; return; }
    if (!key) { $("updated").textContent = "Open this page with your private dashboard link."; render(); return; }
    $("updated").textContent = "Refreshing…";
    try {
      const r = await fetch(SHEET_URL + "?key=" + encodeURIComponent(key), { cache: "no-store" });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      rows = (j.rows || []).map(x => ({ ...x, attending: String(x.attending || "").toLowerCase() === "no" ? "no" : "yes" }));
      $("updated").textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      $("note").textContent = "";
    } catch (e) {
      $("updated").textContent = "Couldn't load replies";
      $("note").textContent = "Check your internet connection and tap Refresh.";
    }
    render();
  }

  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));
  $("refresh").addEventListener("click", load);
  async function copy(list, label) {
    const text = list.join("\n");
    if (!text) { $("note").textContent = "Nothing to copy yet."; return; }
    try { await navigator.clipboard.writeText(text); $("note").textContent = "Copied " + list.length + " " + label + "."; }
    catch (e) { $("note").textContent = text; }
  }
  $("copyNums").addEventListener("click", () => copy(rows.filter(r => r.attending === "yes" && r.phone).map(r => r.phone), "WhatsApp numbers"));
  $("copyEmails").addEventListener("click", () => copy(rows.filter(r => r.attending === "yes" && r.email).map(r => r.email), "emails"));
  load();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
